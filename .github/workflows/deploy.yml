name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Checkout development source
        uses: actions/checkout@v6
        with:
          ref: dev
          path: source-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source-main/package-lock.json
            source-dev/package-lock.json

      - name: Install production dependencies
        working-directory: source-main
        run: npm ci

      - name: Build production
        working-directory: source-main
        run: npm run build

      - name: Stage production build
        run: mv source-main/dist pages

      - name: Install development dependencies
        working-directory: source-dev
        run: npm ci

      - name: Build development
        working-directory: source-dev
        run: npm run build:dev -- --base=/baplcp-signup/dev/

      - name: Stage development build
        run: mv source-dev/dist pages/dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
